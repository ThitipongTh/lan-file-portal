services:
  portal:
    build: .
    container_name: aimslab-file-sharing
    restart: unless-stopped
    # Run as the user that owns SHARE_PATH so uploads/deletes can write to it.
    # Find your values with `id -u` and `id -g`. Defaults suit the first Linux user.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Host PORT -> app port 8000. Expose only on your trusted LAN.
      - "${PORT:-8080}:8000"
    environment:
      # Blank ADMIN_PASSWORD disables the admin page; public download still works.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Optional: keep admin sessions valid across restarts. Blank => ephemeral.
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Max upload size in bytes (default 2 GiB). 0 disables the cap.
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-2147483648}"
    volumes:
      # The Share: your host folder, mounted READ-WRITE so the admin can manage it.
      - type: bind
        source: ${SHARE_PATH:-./shared}
        target: /srv/shared
        bind:
          create_host_path: false
    read_only: true          # app code/filesystem is read-only; only the Share is writable
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
