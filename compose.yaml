services:
  portal:
    image: nginx:stable-alpine
    container_name: lan-file-portal
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - type: bind
        source: ${SHARE_PATH:-./shared}
        target: /srv/shared
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
